<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Accessible Screen Reader</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <span class="header-icon">♿</span>
    <h1>AI Screen Reader &amp; Restyler</h1>
  </header>

  <main>
    <section class="section">
      <h2>Typography</h2>
      <label class="field">
        <span>Dyslexia-friendly font</span>
        <select id="dyslexiaFont">
          <option value="none">Off</option>
          <option value="lexend">Lexend</option>
          <option value="opendyslexic">OpenDyslexic</option>
        </select>
      </label>
      <label class="field">
        <span>Font size <output id="fontScaleOut">100%</output></span>
        <input type="range" id="fontScale" min="80" max="200" step="10" value="100" />
      </label>
      <label class="field">
        <span>Line height <output id="lineHeightOut">Default</output></span>
        <input type="range" id="lineHeight" min="1.2" max="2.4" step="0.1" value="1.8" />
      </label>
      <label class="checkbox-field">
        <input type="checkbox" id="bionicReading" />
        <span>Bionic reading (bold word starts)</span>
      </label>
    </section>

    <section class="section">
      <h2>Visual Comfort</h2>
      <label class="field">
        <span>Contrast theme</span>
        <select id="contrastMode">
          <option value="none">Off</option>
          <option value="dark">Dark (black / yellow)</option>
          <option value="light">Warm (cream / navy)</option>
        </select>
      </label>
      <label class="checkbox-field">
        <input type="checkbox" id="declutter" />
        <span>Reduce clutter, glare &amp; motion</span>
      </label>
      <label class="checkbox-field">
        <input type="checkbox" id="hudVisible" checked />
        <span>Show floating on-page toolbar</span>
      </label>
    </section>

    <section class="section">
      <h2>Screen Reader</h2>
      <label class="field">
        <span>Voice</span>
        <select id="voiceSelect"><option value="">System default</option></select>
      </label>
      <label class="field">
        <span>Speech rate <output id="ttsRateOut">1.0x</output></span>
        <input type="range" id="ttsRate" min="0.5" max="2" step="0.1" value="1" />
      </label>
      <label class="field">
        <span>Pitch <output id="ttsPitchOut">1.0</output></span>
        <input type="range" id="ttsPitch" min="0" max="2" step="0.1" value="1" />
      </label>
      <button id="toggleReadBtn" class="btn btn-primary">▶ Start / Stop Reading (Alt+R)</button>
      <p class="hint">Alt+N / Alt+P move to the next / previous element.</p>
    </section>

    <section class="section">
      <h2>AI Vision (Gemini)</h2>
      <label class="field">
        <span>Gemini API key</span>
        <input type="password" id="apiKey" placeholder="Paste your Gemini API key" autocomplete="off" />
      </label>
      <div class="row">
        <button id="saveKeyBtn" class="btn">Save Key</button>
        <span id="keyStatus" class="status-text"></span>
      </div>
      <label class="checkbox-field">
        <input type="checkbox" id="aiEnabled" checked />
        <span>Enable AI alt-text / ARIA generation</span>
      </label>
      <button id="scanBtn" class="btn btn-primary">✨ Scan This Page with AI</button>
      <p id="scanStatus" class="hint"></p>
    </section>
  </main>

  <footer>
    <button id="resetBtn" class="btn btn-link">Reset all settings</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
