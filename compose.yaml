services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: melbhack
      POSTGRES_USER: melbhack
      POSTGRES_PASSWORD: melbhack
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melbhack -d melbhack"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/database/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  postgres-data:
